<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#101418">
<title>bapTV</title>
<style>
:root {
  --bg: #f3f5f7; --surface: #ffffff; --surface2: #e6eaee; --text: #111418; --muted: #5d6670;
  --accent: #1c6fd9; --accent-text: #ffffff; --danger: #c62828; --shadow: 0 1px 2px rgba(0,0,0,.12);
  --red: #d32f2f; --green: #2e7d32; --yellow: #f9a825; --blue: #1565c0;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101418; --surface: #1b2127; --surface2: #262e36; --text: #e9edf1; --muted: #93a0ad;
    --accent: #4d9bff; --accent-text: #08121e; --danger: #ef5350; --shadow: none;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text); font: 16px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom); user-select: none; -webkit-user-select: none;
  display: flex; flex-direction: column; max-width: 480px; margin: 0 auto;
}
header { padding: 14px 0 10px; min-height: 86px; }
.channel { display: flex; gap: 10px; align-items: baseline; font-size: 20px; font-weight: 600; }
.channel .num { color: var(--muted); font-variant-numeric: tabular-nums; }
.now { margin-top: 2px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar { height: 3px; background: var(--surface2); border-radius: 2px; margin-top: 8px; overflow: hidden; }
.bar > div { height: 100%; width: 0; background: var(--accent); }
.notice { margin-top: 6px; font-size: 14px; color: var(--danger); min-height: 1em; }
.rec { color: var(--danger); font-size: 14px; }
nav { display: flex; background: var(--surface2); border-radius: 10px; padding: 3px; gap: 3px; }
nav button { flex: 1; border: 0; background: none; color: var(--muted); font: inherit; font-weight: 600; padding: 8px; border-radius: 8px; }
nav button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
main { flex: 1; overflow: auto; padding: 14px 0 18px; }
.hidden { display: none !important; }

.row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
.row.four { grid-template-columns: repeat(4, 1fr); }
.key {
  border: 0; border-radius: 12px; background: var(--surface); color: var(--text); box-shadow: var(--shadow);
  font: inherit; font-weight: 600; min-height: 52px; padding: 6px; touch-action: manipulation;
}
.key:active, .key.pressed { background: var(--surface2); transform: scale(.97); }
.key svg { display: block; margin: 0 auto; }
.key small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.colour { min-height: 34px; }
.colour.red { background: var(--red); } .colour.green { background: var(--green); }
.colour.yellow { background: var(--yellow); } .colour.blue { background: var(--blue); }

.pad { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin: 4px 0 16px; --d: min(210px, calc(100vw - 32px - 150px)); }
.dpad { position: relative; width: var(--d); height: var(--d); border-radius: 50%; background: var(--surface); box-shadow: var(--shadow); }
.dpad button { position: absolute; border: 0; background: none; color: var(--text); font-size: 22px; touch-action: manipulation; width: 33.4%; height: 33.4%; }
.dpad button:active { color: var(--accent); }
.dpad .up { top: 0; left: 33.3%; }
.dpad .down { bottom: 0; left: 33.3%; }
.dpad .left { left: 0; top: 33.3%; }
.dpad .right { right: 0; top: 33.3%; }
.dpad .ok {
  left: 29.5%; top: 29.5%; width: 41%; height: 41%; border-radius: 50%; background: var(--accent); color: var(--accent-text);
  font-size: 18px; font-weight: 700;
}
.dpad .ok:active { color: var(--accent-text); filter: brightness(.9); }
.rocker { display: flex; flex-direction: column; gap: 8px; align-items: center; }
.rocker .key { width: 64px; min-height: 64px; font-size: 20px; }
.rocker span { font-size: 12px; color: var(--muted); font-weight: 600; }

.digits { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.digits .key { font-size: 22px; min-height: 56px; }

.search {
  width: 100%; border: 0; border-radius: 10px; padding: 12px 14px; font: inherit; background: var(--surface);
  color: var(--text); box-shadow: var(--shadow); margin-bottom: 10px; user-select: text; -webkit-user-select: text;
}
.list { background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
.item { display: grid; grid-template-columns: 48px 1fr; gap: 4px 8px; padding: 11px 14px; border-top: 1px solid var(--surface2); }
.item:first-child { border-top: 0; }
.item:active { background: var(--surface2); }
.item .n { color: var(--muted); font-variant-numeric: tabular-nums; grid-row: span 2; padding-top: 1px; }
.item .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .p { color: var(--muted); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-height: 1em; }
.item.current .t { color: var(--accent); }
.empty { color: var(--muted); padding: 24px 4px; text-align: center; }

.tools { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.tip { color: var(--muted); font-size: 13px; margin: 0 2px 10px; }
.org { display: grid; grid-template-columns: 40px 44px 1fr 48px; align-items: center; padding: 0 4px 0 0; border-top: 1px solid var(--surface2); background: var(--surface); }
.org:first-child { border-top: 0; }
.org.off .n, .org.off .t { opacity: .45; }
.org.dragging { position: relative; z-index: 2; box-shadow: 0 4px 14px rgba(0,0,0,.35); }
.org .handle { align-self: stretch; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 20px; touch-action: none; cursor: grab; }
.org .n { color: var(--muted); font-variant-numeric: tabular-nums; }
.org .t { padding: 13px 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.org .t small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.org .eye { border: 0; background: none; color: var(--text); height: 44px; display: flex; align-items: center; justify-content: center; touch-action: manipulation; }
.org.off .eye { color: var(--muted); }

h2 { font-size: 15px; margin: 18px 2px 8px; color: var(--muted); font-weight: 600; }
h2:first-child { margin-top: 0; }
.field { display: flex; gap: 8px; margin-bottom: 10px; }
.field .search { margin: 0; flex: 1; min-width: 0; }
.field .key { min-height: 0; padding: 0 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.chip { border: 0; border-radius: 14px; background: var(--surface2); color: var(--text); font: inherit; font-size: 13px; padding: 5px 10px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
.filters select, .filters .search { margin: 0; appearance: none; -webkit-appearance: none; }
.check { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; margin: 4px 2px 10px; }
.summary { color: var(--muted); font-size: 13px; margin: 0 2px 8px; }
.stream { display: grid; grid-template-columns: 34px 14px 1fr; gap: 0 8px; align-items: center; padding: 10px 12px; border-top: 1px solid var(--surface2); }
.stream:first-child { border-top: 0; }
.stream input { width: 20px; height: 20px; margin: 0; }
.stream .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stream .p { grid-column: 3; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stream.added { opacity: .5; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--surface2); }
.dot.OK { background: #2e9d4f; } .dot.BLOCKED, .dot.TIMEOUT { background: #e0a020; }
.dot.DEAD, .dot.DRM, .dot.ERROR { background: var(--danger); } .dot.busy { background: var(--accent); }
.mine { display: grid; grid-template-columns: 52px 1fr 44px; align-items: center; padding: 0 4px 0 14px; border-top: 1px solid var(--surface2); }
.mine:first-child { border-top: 0; }
.mine .n { color: var(--muted); font-variant-numeric: tabular-nums; }
.mine .t { padding: 12px 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mine button { border: 0; background: none; color: var(--muted); font-size: 18px; height: 44px; }
.addbar { position: sticky; bottom: 0; padding: 10px 0 4px; background: linear-gradient(transparent, var(--bg) 30%); }
.addbar .key { width: 100%; background: var(--accent); color: var(--accent-text); }
.addbar .key:disabled { opacity: .5; }
.more { width: 100%; margin-top: 8px; }

.unpaired { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 12px; padding: 24px 4px; }
.unpaired h1 { font-size: 22px; margin: 0; }
.unpaired p { margin: 0; color: var(--muted); }
</style>
</head>
<body>
<section id="unpaired" class="unpaired hidden">
  <h1 data-t="unpairedTitle"></h1>
  <p id="unpairedText"></p>
</section>

<div id="app" class="hidden" style="display:flex;flex-direction:column;flex:1;min-height:0">
  <header>
    <div class="channel"><span class="num" id="chNum"></span><span id="chName">bapTV</span></div>
    <div class="now" id="now"></div>
    <div class="bar"><div id="progress"></div></div>
    <div class="notice" id="notice"></div>
  </header>
  <nav>
    <button class="on" data-tab="remote" data-t="tabRemote"></button>
    <button data-tab="channels" data-t="tabChannels"></button>
    <button data-tab="organise" data-t="tabOrganise"></button>
    <button data-tab="iptv" data-t="tabIptv"></button>
  </nav>
  <main>
    <section id="tab-remote">
      <div class="row">
        <button class="key" data-key="MENU" data-t="menu"></button>
        <button class="key" data-key="GUIDE" data-t="guide"></button>
        <button class="key" data-key="INFO" data-t="info"></button>
      </div>
      <div class="pad">
        <div class="rocker"></div>
        <div class="dpad">
          <button class="up" data-key="UP" data-repeat aria-label="up">▲</button>
          <button class="left" data-key="LEFT" data-repeat aria-label="left">◀</button>
          <button class="ok" data-key="OK">OK</button>
          <button class="right" data-key="RIGHT" data-repeat aria-label="right">▶</button>
          <button class="down" data-key="DOWN" data-repeat aria-label="down">▼</button>
        </div>
        <div class="rocker">
          <button class="key" data-key="CHUP" data-repeat aria-label="channel up"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
          <span>CH</span>
          <button class="key" data-key="CHDOWN" data-repeat aria-label="channel down"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
        </div>
      </div>
      <div class="row">
        <button class="key" data-key="BACK" data-t="back"></button>
        <button class="key" data-key="PLAYPAUSE"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l7 6-7 6z" fill="currentColor" stroke="none"/><path d="M15 6v12M20 6v12"/></svg><small data-t="pause"></small></button>
        <button class="key" data-key="LAST" data-t="last"></button>
      </div>
      <div class="row four">
        <button class="key colour red" data-key="RED" aria-label="red"></button>
        <button class="key colour green" data-key="GREEN" aria-label="green"></button>
        <button class="key colour yellow" data-key="YELLOW" aria-label="yellow"></button>
        <button class="key colour blue" data-key="BLUE" aria-label="blue"></button>
      </div>
      <div class="row">
        <button class="key" data-key="AUDIO" data-t="audio"></button>
        <button class="key" data-key="SUBTITLES" data-t="subtitles"></button>
        <button class="key" id="digitsToggle" data-t="digits"></button>
      </div>
      <div class="digits hidden" id="digits"></div>
    </section>
    <section id="tab-channels" class="hidden">
      <input class="search" id="search" type="search" autocomplete="off">
      <div class="list" id="list"></div>
    </section>
    <section id="tab-organise" class="hidden">
      <div class="tools">
        <button class="key" id="scrambledToggle"></button>
        <button class="key" id="resetOrder" data-t="reset"></button>
      </div>
      <p class="tip" data-t="organiseTip"></p>
      <div class="list" id="orgList"></div>
    </section>
    <section id="tab-iptv" class="hidden">
      <h2 id="mineTitle"></h2>
      <div class="list" id="mineList"></div>
      <h2 data-t="addTitle"></h2>
      <div class="field">
        <input class="search" id="playlistUrl" type="url" inputmode="url" autocomplete="off" placeholder="https://…/playlist.m3u">
        <button class="key" id="loadUrl" data-t="load"></button>
      </div>
      <div class="field">
        <button class="key" id="loadFile" data-t="fromFile" style="flex:1;min-height:44px"></button>
        <input id="playlistFile" type="file" accept=".m3u,.m3u8,audio/x-mpegurl,application/vnd.apple.mpegurl,text/plain" hidden>
      </div>
      <div class="chips" id="sources"></div>
      <div id="playlist" class="hidden">
        <div class="filters">
          <select class="search" id="groupFilter"></select>
          <input class="search" id="streamSearch" type="search" autocomplete="off">
        </div>
        <label class="check"><input type="checkbox" id="workingOnly"><span data-t="workingOnly"></span></label>
        <div class="tools">
          <button class="key" id="probeShown" data-t="probe"></button>
          <button class="key" id="selectWorking" data-t="selectWorking"></button>
        </div>
        <p class="summary" id="summary"></p>
        <div class="list" id="streamList"></div>
        <button class="key more hidden" id="showMore" data-t="showMore"></button>
        <div class="addbar"><button class="key" id="addSelected" disabled></button></div>
      </div>
    </section>
  </main>
</div>

<script>
"use strict";
const STRINGS = {
  en: {
    unpairedTitle: "Phone not paired", unpairedText: "On the TV open bapTV, press OK for the menu and choose Settings → Phone remote, then scan the QR code with this phone.",
    pairFailed: "The pairing code has expired or was already used. Show the QR code on the TV again and scan it.",
    tabRemote: "Remote", tabChannels: "Channels", menu: "Menu", guide: "Guide", info: "Info", back: "Back", pause: "Pause",
    last: "Previous", audio: "Audio", subtitles: "Subtitles", digits: "123", search: "Search channels",
    offline: "No connection to the set-top box", notOnScreen: "bapTV is not on the TV screen", cannotTune: "Cannot switch channel now",
    noChannels: "No channels", recording: "● Recording: ", otherScreen: "bapTV",
    tabOrganise: "Organise", reset: "Restore defaults", scrambledHidden: "Scrambled: hidden", scrambledShown: "Scrambled: shown",
    organiseTip: "Drag ≡ to move a channel, tap its name to rename it; the eye hides it from the list and zapping.",
    renamePrompt: "Channel name (empty brings back the broadcaster's name):", resetConfirm: "Restore the default order and show all channels? Your channel names stay.",
    hiddenByScrambled: "Hidden with all scrambled channels – switch “Scrambled” to shown first.", saveFailed: "Change not saved",
    tabIptv: "Internet", mineTitle: "Internet channels", noMine: "None yet – add them from a playlist below.",
    addTitle: "Add from an M3U playlist", load: "Load", fromFile: "Choose a playlist file…", loading: "Loading the playlist…",
    loadFailed: "Could not load the playlist: ", allGroups: "All groups", searchStreams: "Search", workingOnly: "Only working",
    probe: "Check shown", probing: "Checking… ", stop: "Stop", selectWorking: "Select working",
    summary: (n, checked, ok, sel) => `${n} channels · checked ${checked} · working ${ok} · selected ${sel}`,
    showMore: "Show more", add: n => `Add selected (${n})`, added: n => `Added ${n} channels`, alreadyAdded: "added",
    removeConfirm: name => `Remove “${name}”?`,
    status: { OK: "works", BLOCKED: "blocked (often outside its country)", DEAD: "dead", TIMEOUT: "no answer", DRM: "DRM – cannot play", ERROR: "error" },
  },
  pl: {
    unpairedTitle: "Telefon nie jest sparowany", unpairedText: "Na telewizorze otwórz bapTV, wciśnij OK, aby otworzyć menu, i wybierz Ustawienia → Pilot w telefonie, a potem zeskanuj kod QR tym telefonem.",
    pairFailed: "Kod parowania wygasł albo został już użyty. Pokaż ponownie kod QR na telewizorze i zeskanuj go.",
    tabRemote: "Pilot", tabChannels: "Kanały", menu: "Menu", guide: "Program", info: "Info", back: "Wstecz", pause: "Pauza",
    last: "Poprzedni", audio: "Audio", subtitles: "Napisy", digits: "123", search: "Szukaj kanału",
    offline: "Brak połączenia z dekoderem", notOnScreen: "bapTV nie jest na ekranie telewizora", cannotTune: "Nie można teraz przełączyć kanału",
    noChannels: "Brak kanałów", recording: "● Nagrywanie: ", otherScreen: "bapTV",
    tabOrganise: "Porządkuj", reset: "Przywróć domyślne", scrambledHidden: "Kodowane: ukryte", scrambledShown: "Kodowane: widoczne",
    organiseTip: "Przeciągnij ≡, aby przenieść kanał, dotknij nazwy, aby ją zmienić; oko ukrywa kanał z listy i przełączania.",
    renamePrompt: "Nazwa kanału (pusta przywraca nazwę nadawcy):", resetConfirm: "Przywrócić domyślną kolejność i pokazać wszystkie kanały? Twoje nazwy kanałów zostaną.",
    hiddenByScrambled: "Ukryty razem ze wszystkimi kodowanymi – najpierw przełącz „Kodowane” na widoczne.", saveFailed: "Nie zapisano zmiany",
    tabIptv: "Internet", mineTitle: "Kanały internetowe", noMine: "Jeszcze żadnych – dodaj je z listy poniżej.",
    addTitle: "Dodaj z listy M3U", load: "Wczytaj", fromFile: "Wybierz plik z listą…", loading: "Wczytywanie listy…",
    loadFailed: "Nie udało się wczytać listy: ", allGroups: "Wszystkie grupy", searchStreams: "Szukaj", workingOnly: "Tylko działające",
    probe: "Sprawdź widoczne", probing: "Sprawdzanie… ", stop: "Zatrzymaj", selectWorking: "Zaznacz działające",
    summary: (n, checked, ok, sel) => `${n} kanałów · sprawdzone ${checked} · działa ${ok} · zaznaczone ${sel}`,
    showMore: "Pokaż więcej", add: n => `Dodaj zaznaczone (${n})`, added: n => `Dodano kanałów: ${n}`, alreadyAdded: "dodany",
    removeConfirm: name => `Usunąć „${name}”?`,
    status: { OK: "działa", BLOCKED: "zablokowany (często poza krajem nadawcy)", DEAD: "nie działa", TIMEOUT: "brak odpowiedzi", DRM: "DRM – nie do odtworzenia", ERROR: "błąd" },
  },
};
const lang = (navigator.language || "en").toLowerCase().startsWith("pl") ? "pl" : "en";
const T = STRINGS[lang];
document.documentElement.lang = lang;
document.querySelectorAll("[data-t]").forEach(el => {
  const span = document.createTextNode(T[el.dataset.t]);
  el.firstElementChild ? el.firstElementChild.textContent = T[el.dataset.t] : el.appendChild(span);
});
const $ = id => document.getElementById(id);
$("search").placeholder = T.search;

let paired = null;
let channels = [];
let currentId = null;
let noticeTimer = 0;

class Unpaired extends Error {}

async function api(path, method = "GET", body) {
  const response = await fetch(path, { method, body, cache: "no-store", headers: body ? { "Content-Type": "application/json" } : {} });
  if (response.status === 401) { showUnpaired(); throw new Unpaired(); }
  const result = await response.json().catch(() => ({}));
  if (!response.ok) { const e = new Error(result.error || response.status); e.status = response.status; throw e; }
  return result;
}

function showUnpaired(failed) {
  paired = false;
  $("app").classList.add("hidden");
  $("unpaired").classList.remove("hidden");
  $("unpairedText").textContent = failed ? T.pairFailed : T.unpairedText;
}

function showApp() {
  if (paired) return;
  paired = true;
  $("unpaired").classList.add("hidden");
  $("app").classList.remove("hidden");
}

function notice(text, ms = 3000) {
  $("notice").textContent = text || "";
  clearTimeout(noticeTimer);
  if (text && ms) noticeTimer = setTimeout(() => $("notice").textContent = "", ms);
}

function explain(error) {
  if (error instanceof Unpaired) return;
  if (error.status === 409) notice(error.message === "app not on screen" ? T.notOnScreen : T.cannotTune);
  else notice(T.offline, 0);
}

// ---- State ----

function formatTime(ms) {
  return new Date(ms).toLocaleTimeString(lang, { hour: "2-digit", minute: "2-digit" });
}

function renderState(s) {
  const ch = s.channel;
  $("chNum").textContent = ch ? ch.number : "";
  $("chName").textContent = ch ? ch.name : T.otherScreen;
  currentId = ch ? ch.id : null;
  let line = "";
  let progress = 0;
  if (s.now) {
    line = `${formatTime(s.now.start)} ${s.now.title}`;
    const span = s.now.end - s.now.start;
    if (span > 0) progress = Math.max(0, Math.min(1, (Date.now() - s.now.start) / span));
  }
  if (s.next) line += `  ·  ${formatTime(s.next.start)} ${s.next.title}`;
  $("now").textContent = line;
  $("progress").style.width = `${progress * 100}%`;
  if (s.recording) notice(T.recording + s.recording, 0);
  else if ($("notice").textContent.startsWith(T.recording) || $("notice").textContent === T.offline) notice("");
  markCurrent();
}

async function refreshState() {
  if (document.hidden || paired === false) return;
  try {
    const s = await api("/api/state");
    showApp();
    renderState(s);
  } catch (e) { explain(e); }
}

// ---- Keys ----

async function sendKey(name) {
  if (navigator.vibrate) navigator.vibrate(12);
  try {
    await api(`/api/key?name=${encodeURIComponent(name)}`, "POST");
    setTimeout(refreshState, 400);
  } catch (e) { explain(e); }
}

// Arrows and CH keys repeat while held, like on a real remote.
document.querySelectorAll("[data-key]").forEach(button => {
  let delay = 0, repeat = 0;
  const stop = () => { clearTimeout(delay); clearInterval(repeat); button.classList.remove("pressed"); };
  button.addEventListener("pointerdown", event => {
    event.preventDefault();
    button.classList.add("pressed");
    sendKey(button.dataset.key);
    if ("repeat" in button.dataset) delay = setTimeout(() => repeat = setInterval(() => sendKey(button.dataset.key), 220), 500);
  });
  ["pointerup", "pointerleave", "pointercancel"].forEach(type => button.addEventListener(type, stop));
  button.addEventListener("contextmenu", event => event.preventDefault());
});

const digits = $("digits");
["1", "2", "3", "4", "5", "6", "7", "8", "9", "", "0", ""].forEach(d => {
  const b = document.createElement("button");
  if (d) {
    b.className = "key";
    b.textContent = d;
    b.addEventListener("pointerdown", event => { event.preventDefault(); sendKey(d); });
  } else b.style.visibility = "hidden";
  digits.appendChild(b);
});
$("digitsToggle").addEventListener("click", () => digits.classList.toggle("hidden"));

// ---- Channels ----

function markCurrent() {
  document.querySelectorAll(".item").forEach(el => el.classList.toggle("current", Number(el.dataset.id) === currentId));
}

function renderChannels() {
  const query = $("search").value.trim().toLowerCase();
  const list = $("list");
  list.textContent = "";
  const shown = channels.filter(c => !query || c.name.toLowerCase().includes(query) || c.number.startsWith(query));
  if (!shown.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = T.noChannels;
    list.appendChild(empty);
    return;
  }
  shown.forEach(c => {
    const item = document.createElement("div");
    item.className = "item";
    item.dataset.id = c.id;
    const n = document.createElement("div"); n.className = "n"; n.textContent = c.number;
    const t = document.createElement("div"); t.className = "t"; t.textContent = (c.radio ? "♪ " : "") + c.name;
    const p = document.createElement("div"); p.className = "p"; p.textContent = c.now || "";
    item.append(n, t, p);
    item.addEventListener("click", () => tune(c.id));
    list.appendChild(item);
  });
  markCurrent();
}

async function loadChannels() {
  try {
    channels = (await api("/api/channels")).channels;
    renderChannels();
  } catch (e) { explain(e); }
}

async function tune(id) {
  if (navigator.vibrate) navigator.vibrate(12);
  try {
    await api(`/api/tune?id=${id}`, "POST");
    currentId = id;
    markCurrent();
    setTimeout(refreshState, 600);
  } catch (e) { explain(e); }
}

$("search").addEventListener("input", renderChannels);

// ---- Organise: order, names, hiding ----

const EYE = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><path d="M3 3l18 18"/></svg>';

let organised = { hideScrambled: false, channels: [] };

function renderOrganise() {
  $("scrambledToggle").textContent = organised.hideScrambled ? T.scrambledHidden : T.scrambledShown;
  const list = $("orgList");
  list.textContent = "";
  organised.channels.forEach(c => {
    const row = document.createElement("div");
    row.className = "org" + (c.hidden ? " off" : "");
    row.dataset.id = c.id;
    const handle = document.createElement("div"); handle.className = "handle"; handle.textContent = "≡";
    const n = document.createElement("div"); n.className = "n"; n.textContent = c.number;
    const t = document.createElement("div"); t.className = "t"; t.textContent = c.name;
    const badges = [c.radio ? "♪" : "", c.scrambled ? "🔒" : "", c.virtual ? "HbbTV" : ""].filter(Boolean).join(" ");
    if (badges) { const b = document.createElement("small"); b.textContent = badges; t.appendChild(b); }
    const eye = document.createElement("button"); eye.className = "eye"; eye.innerHTML = c.hidden ? EYE_OFF : EYE;
    eye.setAttribute("aria-label", c.hidden ? "show" : "hide");
    t.addEventListener("click", () => rename(c));
    eye.addEventListener("click", () => toggleHidden(c));
    startDrag(handle, row);
    row.append(handle, n, t, eye);
    list.appendChild(row);
  });
}

async function loadOrganise() {
  try {
    organised = await api("/api/manage");
    renderOrganise();
  } catch (e) { explain(e); }
}

/** Sends a change; the server answers with the updated list. */
async function change(path) {
  try {
    organised = await api(path, "POST");
    renderOrganise();
  } catch (e) {
    if (!(e instanceof Unpaired)) notice(T.saveFailed);
    loadOrganise();
  }
}

function rename(c) {
  const name = prompt(T.renamePrompt, c.name);
  if (name === null || name.trim() === c.name) return;
  change(`/api/manage/name?id=${c.id}&name=${encodeURIComponent(name.trim())}`);
}

function toggleHidden(c) {
  if (c.hidden && c.scrambled && organised.hideScrambled) { notice(T.hiddenByScrambled, 5000); return; }
  change(`/api/manage/hidden?id=${c.id}&hidden=${!c.hidden}`);
}

$("scrambledToggle").addEventListener("click", () => change(`/api/manage/hide-scrambled?on=${!organised.hideScrambled}`));
$("resetOrder").addEventListener("click", () => { if (confirm(T.resetConfirm)) change("/api/manage/reset"); });

/** Drag by the handle: the row follows the finger, the others make room; the order is sent on release. */
function startDrag(handle, row) {
  handle.addEventListener("pointerdown", event => {
    event.preventDefault();
    handle.setPointerCapture(event.pointerId);
    const list = $("orgList");
    let lastY = event.clientY;
    row.classList.add("dragging");
    if (navigator.vibrate) navigator.vibrate(12);
    const move = e => {
      lastY = e.clientY;
      // Swap with the neighbour once the finger passes its middle.
      const prev = row.previousElementSibling, next = row.nextElementSibling;
      if (prev && lastY < prev.getBoundingClientRect().top + prev.offsetHeight / 2) list.insertBefore(row, prev);
      else if (next && lastY > next.getBoundingClientRect().top + next.offsetHeight / 2) list.insertBefore(next, row);
      // Near the screen edges the page scrolls along.
      const main = document.querySelector("main"), box = main.getBoundingClientRect();
      if (lastY < box.top + 40) main.scrollTop -= 12; else if (lastY > box.bottom - 40) main.scrollTop += 12;
    };
    const end = () => {
      handle.removeEventListener("pointermove", move);
      handle.removeEventListener("pointerup", end);
      handle.removeEventListener("pointercancel", end);
      row.classList.remove("dragging");
      const ids = [...list.children].map(el => el.dataset.id);
      if (ids.join() !== organised.channels.map(c => String(c.id)).join()) change(`/api/manage/order?ids=${ids.join(",")}`);
    };
    handle.addEventListener("pointermove", move);
    handle.addEventListener("pointerup", end);
    handle.addEventListener("pointercancel", end);
  });
}

// ---- Internet channels ----

const PAGE = 150;
let mine = { channels: [], sources: [] };
let streams = [];          // loaded playlist entries, each with .status/.detail after a check
let selected = new Set();  // indexes into streams
let shownLimit = PAGE;
let probing = false;

async function loadMine() {
  try {
    mine = await api("/api/iptv");
    renderMine();
  } catch (e) { explain(e); }
}

function renderMine() {
  $("mineTitle").textContent = `${T.mineTitle} (${mine.channels.length})`;
  const list = $("mineList");
  list.textContent = "";
  if (!mine.channels.length) {
    const empty = document.createElement("div"); empty.className = "empty"; empty.textContent = T.noMine;
    list.appendChild(empty);
  }
  mine.channels.forEach(c => {
    const row = document.createElement("div"); row.className = "mine";
    const n = document.createElement("div"); n.className = "n"; n.textContent = c.number;
    const t = document.createElement("div"); t.className = "t"; t.textContent = c.name;
    const x = document.createElement("button"); x.textContent = "✕"; x.setAttribute("aria-label", "remove");
    t.addEventListener("click", () => tune(c.id));
    x.addEventListener("click", async () => {
      if (!confirm(T.removeConfirm(c.name))) return;
      try { mine = await api(`/api/iptv/remove?ids=${c.id}`, "POST"); renderMine(); renderStreams(); } catch (e) { explain(e); }
    });
    row.append(n, t, x);
    list.appendChild(row);
  });
  const chips = $("sources");
  chips.textContent = "";
  mine.sources.forEach(url => {
    const chip = document.createElement("button"); chip.className = "chip"; chip.textContent = url.replace(/^https?:\/\//, "");
    chip.addEventListener("click", () => { $("playlistUrl").value = url; loadPlaylist(url); });
    chips.appendChild(chip);
  });
}

async function loadPlaylist(url, file) {
  notice(T.loading, 0);
  try {
    const response = await fetch(url ? `/api/iptv/load?url=${encodeURIComponent(url)}` : "/api/iptv/load",
      { method: "POST", body: file ? await file.text() : undefined, cache: "no-store" });
    if (response.status === 401) { showUnpaired(); return; }
    const body = await response.json().catch(() => ({}));
    if (!response.ok) { notice(T.loadFailed + (body.error || response.status), 6000); return; }
    streams = body.streams;
    selected = new Set();
    shownLimit = PAGE;
    const groups = [...new Set(streams.map(s => s.group).filter(Boolean))].sort((a, b) => a.localeCompare(b));
    const select = $("groupFilter");
    select.textContent = "";
    [["", T.allGroups], ...groups.map(g => [g, g])].forEach(([value, label]) => {
      const o = document.createElement("option"); o.value = value; o.textContent = label; select.appendChild(o);
    });
    $("playlist").classList.remove("hidden");
    notice("");
    renderStreams();
    if (url) loadMine();
  } catch (e) { notice(T.loadFailed + e.message, 6000); }
}

function addedUrls() { return new Set(mine.channels.map(c => c.url)); }

/** Indexes of the streams that pass the filters. */
function filtered() {
  const group = $("groupFilter").value;
  const query = $("streamSearch").value.trim().toLowerCase();
  const working = $("workingOnly").checked;
  const result = [];
  streams.forEach((s, i) => {
    if (group && s.group !== group) return;
    if (query && !s.name.toLowerCase().includes(query)) return;
    if (working && s.status !== "OK") return;
    result.push(i);
  });
  return result;
}

function renderStreams() {
  if (!streams.length) return;
  const added = addedUrls();
  const shown = filtered();
  const list = $("streamList");
  list.textContent = "";
  shown.slice(0, shownLimit).forEach(i => {
    const s = streams[i];
    const isAdded = added.has(s.url);
    const row = document.createElement("label"); row.className = "stream" + (isAdded ? " added" : "");
    const box = document.createElement("input"); box.type = "checkbox"; box.checked = selected.has(i); box.disabled = isAdded;
    box.addEventListener("change", () => { box.checked ? selected.add(i) : selected.delete(i); updateSummary(); });
    const dot = document.createElement("span"); dot.className = "dot " + (s.busy ? "busy" : s.status || "");
    const t = document.createElement("span"); t.className = "t"; t.textContent = s.name;
    const p = document.createElement("span"); p.className = "p";
    p.textContent = [s.group, isAdded ? T.alreadyAdded : s.status ? `${T.status[s.status]}${s.detail && s.status !== "OK" ? ` (${s.detail})` : ""}` : ""]
      .filter(Boolean).join(" · ");
    row.append(box, dot, t, p);
    list.appendChild(row);
  });
  $("showMore").classList.toggle("hidden", shown.length <= shownLimit);
  updateSummary();
}

function updateSummary() {
  const checked = streams.filter(s => s.status).length;
  const ok = streams.filter(s => s.status === "OK").length;
  $("summary").textContent = T.summary(filtered().length, checked, ok, selected.size);
  $("addSelected").textContent = T.add(selected.size);
  $("addSelected").disabled = selected.size === 0;
}

function payload(s) {
  const { status, detail, busy, ...stream } = s;
  return stream;
}

/** Checks the shown streams that were not checked yet, in batches so the list fills in as it goes. */
async function probeShown() {
  if (probing) { probing = false; return; }
  const todo = filtered().slice(0, shownLimit).filter(i => !streams[i].status);
  if (!todo.length) return;
  probing = true;
  $("probeShown").textContent = T.stop;
  try {
    for (let k = 0; k < todo.length && probing; k += 24) {
      const batch = todo.slice(k, k + 24);
      batch.forEach(i => streams[i].busy = true);
      renderStreams();
      notice(T.probing + `${Math.min(k + batch.length, todo.length)}/${todo.length}`, 0);
      const results = await api("/api/iptv/probe", "POST", JSON.stringify(batch.map(i => payload(streams[i]))));
      batch.forEach((i, j) => { streams[i].busy = false; streams[i].status = results[j].status; streams[i].detail = results[j].detail; });
      renderStreams();
    }
  } catch (e) { explain(e); }
  streams.forEach(s => s.busy = false);
  probing = false;
  $("probeShown").textContent = T.probe;
  notice("");
  renderStreams();
}

async function addSelected() {
  const chosen = [...selected].map(i => payload(streams[i]));
  if (!chosen.length) return;
  $("addSelected").disabled = true;
  try {
    mine = await api("/api/iptv/add", "POST", JSON.stringify(chosen));
    notice(T.added(mine.added), 4000);
    selected = new Set();
    renderMine();
    renderStreams();
  } catch (e) { explain(e); updateSummary(); }
}

$("streamSearch").placeholder = T.searchStreams;
$("loadUrl").addEventListener("click", () => { const url = $("playlistUrl").value.trim(); if (url) loadPlaylist(url); });
$("playlistUrl").addEventListener("keydown", e => { if (e.key === "Enter") $("loadUrl").click(); });
$("loadFile").addEventListener("click", () => $("playlistFile").click());
$("playlistFile").addEventListener("change", () => { const f = $("playlistFile").files[0]; if (f) loadPlaylist(null, f); });
["groupFilter", "streamSearch", "workingOnly"].forEach(id => $(id).addEventListener("input", () => { shownLimit = PAGE; renderStreams(); }));
$("showMore").addEventListener("click", () => { shownLimit += PAGE; renderStreams(); });
$("probeShown").addEventListener("click", probeShown);
$("selectWorking").addEventListener("click", () => {
  const added = addedUrls();
  filtered().forEach(i => { if (streams[i].status === "OK" && !added.has(streams[i].url)) selected.add(i); });
  renderStreams();
});
$("addSelected").addEventListener("click", addSelected);

// ---- Tabs and polling ----

document.querySelectorAll("nav button").forEach(button => button.addEventListener("click", () => {
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b === button));
  $("tab-remote").classList.toggle("hidden", button.dataset.tab !== "remote");
  $("tab-channels").classList.toggle("hidden", button.dataset.tab !== "channels");
  $("tab-organise").classList.toggle("hidden", button.dataset.tab !== "organise");
  $("tab-iptv").classList.toggle("hidden", button.dataset.tab !== "iptv");
  if (button.dataset.tab === "iptv") loadMine();
  if (button.dataset.tab === "channels") loadChannels();
  if (button.dataset.tab === "organise") loadOrganise();
}));

if (new URLSearchParams(location.search).get("pair") === "failed") {
  history.replaceState(null, "", "/");
  showUnpaired(true);
} else {
  refreshState();
}
setInterval(refreshState, 2500);
document.addEventListener("visibilitychange", refreshState);
</script>
